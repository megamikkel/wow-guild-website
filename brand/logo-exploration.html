<!doctype html><meta charset="utf-8"><title>PAPI — Brand Review Board</title>
<style>
:root{--navy:#07065F;--red:#ED3026;--blue:#397CEF;--ink:#FBFBFC;--canvas:#05050D;--surface:#0D0D1B;--edge:#22223C;--muted:#9A9AB0;--faint:#5E5E78}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:48px 28px 100px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:-.02em;text-transform:uppercase;margin:0 0 10px;font-family:Archivo,Arial Black,sans-serif}
.lede{color:var(--muted);max-width:60ch;margin:0 0 8px}
.split{height:3px;background:linear-gradient(90deg,var(--red) 0 42%,var(--blue) 58% 100%);margin:26px 0 44px;border-radius:2px}
h2{font-family:Archivo,Arial Black,sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.fin{border:1px solid var(--edge);border-radius:16px;overflow:hidden;margin:0 0 44px;background:var(--surface)}
.finhead{padding:22px 26px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.finhead p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;border-radius:4px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:1px;background:var(--edge)}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.pane{padding:38px 26px;display:flex;align-items:center;justify-content:center;min-height:190px}
.on-navy{background:var(--navy)} .on-black{background:#000} .on-white{background:#fff;color:var(--navy)}
.strip{display:flex;flex-wrap:wrap;gap:26px;align-items:center;padding:22px 26px;border-top:1px solid var(--edge)}
.cell{display:flex;flex-direction:column;align-items:center;gap:7px}
.lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.disc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.disc.sm{width:28px;height:28px} .disc.xs{width:22px;height:22px}
.dc{background:#313338;padding:14px 16px;border-radius:10px;display:flex;align-items:center;gap:11px}
.dc .nm{font-size:13px;font-weight:600;color:#f2f3f5}
.dc .mm{font-size:11px;color:#b5bac1}
.nav{background:var(--canvas);border:1px solid var(--edge);border-radius:10px;padding:0 16px;height:56px;display:flex;align-items:center;gap:22px;min-width:330px}
.nav a{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.cap{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--edge);border-top:1px solid var(--edge)}
.verdict{padding:20px 26px;border-top:1px solid var(--edge);display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.verdict{grid-template-columns:1fr}}
.verdict h4{margin:0 0 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.verdict p{margin:0;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--edge)}
th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.win{color:var(--blue);font-weight:700}
</style>
<div class="wrap">
<p class="kicker">PAPI · Brand identity · Phase 5</p>
<h1>Brand review board</h1>
<p class="lede">Concept 7 — <em>&ldquo;Who&rsquo;s your PAPI&rdquo;</em>. Three complete executions of one idea: the name&rsquo;s own meaning, drawn. Every mark below was designed in monochrome first; colour is applied afterwards and never carries the concept.</p>
<div class="split"></div>
<div id="finalists"></div>
<h2>Scorecard</h2>
<div id="score"></div>
</div>
<script>
const HAND = `<g transform="rotate(-14 32 34)"><path d="M18 19h10a9 9 0 0 1 9 9v15a9 9 0 0 1-9 9H19a9 9 0 0 1-9-9V28a9 9 0 0 1 8-9z"/><rect x="32" y="23" width="27" height="12" rx="6"/><path d="M19 12h9a6 6 0 0 1 0 12h-9z"/></g>`;
const LETTERS = `<path fill-rule="evenodd" d="M0 0h29l9 9v17l-9 9H13v21H0V0zm13 12v11h11l3-3v-5l-3-3H13z"/><path d="M62 0h18l17 56H83L71 17 59 56H45L62 0z"/><path fill-rule="evenodd" d="M104 0h29l9 9v17l-9 9h-16v21h-13V0zm13 12v11h11l3-3v-5l-3-3h-11z"/><path d="M149 0h13v56h-13z"/>`;
const mark = (kind, size, mono) => {
  if (kind === 'point' || mono) return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" fill="currentColor">${HAND}</svg>`;
  if (kind === 'coin') return `<svg viewBox="0 0 64 64" width="${size}" height="${size}"><circle cx="32" cy="32" r="32" fill="#07065F"/><path d="M32 0a32 32 0 0 1 32 32h-4A28 28 0 0 0 32 4z" fill="#ED3026"/><path d="M32 64A32 32 0 0 1 0 32h4a28 28 0 0 0 28 28z" fill="#397CEF"/><g fill="#fff" transform="translate(32 33) scale(.78) translate(-32 -34)">${HAND}</g></svg>`;
  const id = 'c'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}"><defs><clipPath id="t${id}"><path d="M-8 -8H72v14L-8 58z"/></clipPath><clipPath id="b${id}"><path d="M-8 58L72 6v66H-8z"/></clipPath></defs><g clip-path="url(#t${id})" fill="#ED3026">${HAND}</g><g clip-path="url(#b${id})" fill="#397CEF">${HAND}</g></svg>`;
};
const word = (h, color) => `<svg viewBox="-2 -2 166 60" height="${h}" fill="${color||'currentColor'}">${LETTERS}</svg>`;
const lockup = (kind, h, mono) => `<svg viewBox="0 0 258 64" height="${h}" fill="currentColor"><g transform="translate(-3 -3) scale(1.12)">${mark(kind,64,mono).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</g><g transform="translate(88 4)">${LETTERS}</g></svg>`;
const cap = (kind, mono) => `<svg class="cap" viewBox="0 0 200 130" width="190"><path d="M100 16c30 0 52 20 55 46l4 30c1 7-4 12-11 12H52c-7 0-12-5-11-12l4-30c3-26 25-46 55-46z" fill="#141418"/><path d="M45 96h110c22 0 40 8 40 16v4H5v-4c0-8 18-16 40-16z" fill="#0E0E12"/><g transform="translate(72 34)">${mark(kind,56,mono)}</g></svg>`;

const FIN = [
 {id:'point', name:'A — The Point', tag:'Recommended',
  desc:'The gesture, unframed. Nothing but the hand — mass, tilt and one long finger aimed at whoever is reading. The most confident of the three and the only one that is identical in every medium, from a 22px favicon to a single-colour embroidery.',
  str:'One silhouette, zero dependencies. Works in one thread colour. Nothing to strip away.',
  risk:'A free-floating hand has no container discipline — placement rules matter more than for the other two.'},
 {id:'coin', name:'B — The Coin', tag:'Avatar-first',
  desc:'The same hand struck into a coin: navy field, with a red arc rising on one side and a blue arc falling on the other — the split-line wrapped around the rim rather than laid under it. Built for the place PAPI actually lives: a circular Discord avatar.',
  str:'Strongest at 28px and below; the frame guarantees a constant silhouette in any feed.',
  risk:'A filled circle is closer to app-icon territory. It must never be the only version, or the brand becomes a button.'},
 {id:'cut', name:'C — The Cut Point', tag:'Most systematic',
  desc:'The hand sliced by the site&rsquo;s own signature: red above the cut, blue below, with the diagonal running clean through fist and finger. The brand device and the brand mark become the same object.',
  str:'Ties the mark to the whole design system; the most ownable at large sizes.',
  risk:'The cut is invisible in monochrome and in embroidery — it degrades to Finalist A, so it can never be the mark of record.'}
];
const box = document.getElementById('finalists');
FIN.forEach(f => {
  const el = document.createElement('section'); el.className='fin';
  el.innerHTML = `
  <div class="finhead"><div><h2>${f.name}</h2><p>${f.desc}</p></div><span class="tag">${f.tag}</span></div>
  <div class="hero">
    <div class="pane on-navy">${lockup(f.id, 62)}</div>
    <div class="pane on-black">${mark(f.id, 128)}</div>
  </div>
  <div class="grid2">
    <div class="pane on-white" style="min-height:120px">${lockup(f.id, 40)}</div>
    <div class="pane on-black" style="min-height:120px">${word(40,'#fff')}</div>
    <div class="pane on-white" style="min-height:120px">${word(40,'#07065F')}</div>
  </div>
  <div class="strip">
    <div class="cell"><div class="disc" style="background:${f.id==='coin'?'transparent':'#07065F'};color:#fff">${mark(f.id,f.id==='coin'?64:40)}</div><span class="lab">Discord 64</span></div>
    <div class="cell"><div class="disc sm" style="background:${f.id==='coin'?'transparent':'#07065F'};color:#fff">${mark(f.id,f.id==='coin'?28:18)}</div><span class="lab">28 px</span></div>
    <div class="cell"><div class="disc xs" style="background:${f.id==='coin'?'transparent':'#07065F'};color:#fff">${mark(f.id,f.id==='coin'?22:14)}</div><span class="lab">22 px</span></div>
    <div class="cell"><div class="dc">${f.id==='coin'?`<div class="disc sm" style="width:38px;height:38px">${mark(f.id,38)}</div>`:`<div class="disc sm" style="width:38px;height:38px;background:#07065F;color:#fff">${mark(f.id,24)}</div>`}<div><div class="nm">PAPI</div><div class="mm">6/8 Mythic · recruiting</div></div></div><span class="lab">Discord member list</span></div>
  </div>
  <div class="strip">
    <div class="cell"><div class="nav"><span style="color:#fff;display:flex;align-items:center;gap:9px">${mark(f.id,26)}${word(17,'#fff')}</span><a>Roster</a><a>Raids</a><a>Apply</a></div><span class="lab">Website navigation</span></div>
    <div class="cell">${cap(f.id, true)}<span class="lab">Embroidery · one thread</span></div>
    <div class="cell"><div class="pane on-black" style="padding:18px;min-height:0;border-radius:8px">${mark(f.id,54,true)}</div><span class="lab">Mono hvid</span></div>
    <div class="cell"><div class="pane on-white" style="padding:18px;min-height:0;border-radius:8px">${mark(f.id,54,true)}</div><span class="lab">Mono sort</span></div>
  </div>
  <div class="verdict"><div><h4>Strength</h4><p>${f.str}</p></div><div><h4>Risk</h4><p>${f.risk}</p></div></div>`;
  box.appendChild(el);
});
const CRIT=['Memorability','Originality','PAPI identity','Gaming relevance','Premium feeling','Scalability','Merch potential'];
const S={point:[9,9,10,8,8,10,10],coin:[8,7,9,8,9,10,7],cut:[8,9,9,8,9,6,5]};
document.getElementById('score').innerHTML = `<table><tr><th>Criterion</th><th class="n">A — Point</th><th class="n">B — Coin</th><th class="n">C — Cut</th></tr>`+
 CRIT.map((c,i)=>`<tr><td>${c}</td>${['point','coin','cut'].map(k=>{const v=S[k][i];const best=Math.max(S.point[i],S.coin[i],S.cut[i]);return `<td class="n${v===best?' win':''}">${v}</td>`}).join('')}</tr>`).join('')+
 `<tr><td><strong>Total</strong></td>${['point','coin','cut'].map(k=>`<td class="n"><strong>${S[k].reduce((a,b)=>a+b,0)}</strong></td>`).join('')}</tr></table>`;
</script>
